name: Actualizar tarjetas del README
 
on:
  schedule:
    - cron: "0 6 * * 1"   # una vez a la semana (lunes)
  workflow_dispatch:       # para correrlo a mano
 
permissions:
  contents: write
 
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&locale=es
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
 
      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&custom_title=Lenguajes%20m%C3%A1s%20usados
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
 
      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del README" || exit 0
          git push
 
